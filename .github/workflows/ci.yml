name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test source
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build and test
        run: npm test

      - name: Upload CommonJS build
        uses: actions/upload-artifact@v4
        with:
          name: commonjs-build
          path: index.cjs.js

  compatibility:
    name: Node.js ${{ matrix.node-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['0.10', '0.12', 20.x, 22.x, 24.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download CommonJS build
        uses: actions/download-artifact@v4
        with:
          name: commonjs-build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test published entry point
        run: node test.js
